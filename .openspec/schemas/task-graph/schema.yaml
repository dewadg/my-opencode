# task-graph — grammar, invariants and the board format live in README.md beside this file.
name: task-graph
version: 2
description: Spec-driven specs and design with an explicit, validated task graph
artifacts:
  - id: specs
    generates: "specs/**/*.md"
    description: Detailed specifications for the change
    template: spec.md
    instruction: |
      Create specification files that define WHAT the system should do.

      A spec is a behavior contract, not an implementation plan.

      Good spec content:
      - Observable behavior users or downstream systems rely on
      - Inputs, outputs, and error conditions
      - External constraints (security, privacy, reliability, compatibility)
      - Scenarios that can be tested or explicitly validated

      Avoid in specs:
      - Internal class/function names
      - Library or framework choices
      - Step-by-step implementation details
      - Detailed execution plans (those belong in design.md or tasks.md)

      Quick test: if the implementation can change without changing externally
      visible behavior, it likely does not belong in the spec.

      Identify the capability set before writing. Run `openspec list --specs` for the
      project's inventory, then `openspec show "<spec-id>" --type spec --json
      --no-scenarios` for any that look related - that returns purpose and requirement
      texts without pulling whole spec files into context. Append `--store "<id>"` only
      for a registered standalone store, and keep `--type spec`: a change and a spec
      sharing a name is otherwise an ambiguous-item error. The filtered read is only an
      overview; read each relevant spec in full, including scenarios, with
      `openspec show "<spec-id>" --type spec` before deciding what is covered.

      Create one spec file per capability this change introduces or modifies.
      `<capability-path>` is the spec directory relative to `specs/` (for example,
      `user-auth` or `identity/user-auth`). Preserve the full path:
      - New capabilities: use the exact path you record for the capability at `specs/<capability-path>/spec.md`. Any new path segment must be kebab-case. Follow the project's existing organization; do not add a new domain level when the project uses a flat layout.
      - Modified capabilities: use the exact existing path from `openspec/specs/<capability-path>/` when creating the delta at `specs/<capability-path>/spec.md`. Run `openspec list --specs` to confirm that path before writing the delta, appending `--store "<id>"` only for a registered standalone store - a mistyped or invented path targets a capability that does not exist rather than the one you meant. Do not move or rename the capability.

      Write the spec files one at a time, so the user sees progress and an
      interrupted run keeps the files it already wrote:
      - Before writing anything, list the capabilities and compare them with
        the `specs/<capability-path>/spec.md` files that already exist, and
        start with the first capability that has no file. Do not rewrite an
        existing file unless the user asks you to.
      - Before each file, say in one line which capability you are writing.
      - Write each file as soon as you have drafted it. Do not plan every file
        before writing the first.
      - Stop when every capability on that list has its file.

      There must be at least one spec file unless the change's `.openspec.yaml`
      sets `skip_specs: true` (no spec-level behavior change) - `openspec validate`
      rejects a zero-delta change without that marker. If you cannot name at least
      one capability and `skip_specs` is not set, stop and resolve the change scope
      with the user first.

      Delta operations (use ## headers):
      - **ADDED Requirements**: New capabilities
      - **MODIFIED Requirements**: Changed behavior - MUST include full updated content
      - **REMOVED Requirements**: Deprecated features - MUST include **Reason** and **Migration**
      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format

      Format requirements:
      - Each requirement: `### Requirement: <name>` followed by description
      - Use SHALL/MUST for normative requirements (avoid should/may)
      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format
      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3 hashtags or bullets will fail silently.
      - Every requirement MUST have at least one scenario.
      - Every scenario MUST have a WHEN/GIVEN step (its trigger) and a THEN step (its outcome). A scenario with only AND lines or plain prose still counts as a scenario, but `openspec validate` flags it as a warning: normal validation still passes, but `openspec validate --strict` fails on it.
      - Keep each requirement's description (the text between `### Requirement:` and its first scenario) to 500 characters or fewer. `openspec validate` flags longer descriptions in ADDED requirements and in the main spec. This is a warning: normal validation still passes, but `openspec validate --strict` fails on it. When writing a new requirement, state one behavior per requirement: move examples and edge cases into scenarios, and split a requirement that covers several behaviors into separate `### Requirement:` blocks, each with its own scenarios. Under MODIFIED, keep the existing requirement block whole; never split, trim or rewrite existing text just to meet the length. Split an existing long requirement only when the user asks for it, in a change made for that purpose: under MODIFIED, keep its header and every scenario and cut its description down to one behavior without changing its meaning, then add each behavior you removed as its own ADDED requirement with its own scenarios.

      New capabilities only: the delta spec's first section is `## Purpose` -
      one or two sentences (50+ characters, or `openspec validate --strict`
      reports it as too brief) describing what the capability is for. Archive
      copies it into the main spec it creates; without it the new main spec is
      left with a `TBD ... Update Purpose after archive` placeholder to fill in
      by hand. Do NOT add `## Purpose` to a delta for an existing capability -
      that spec already has one and the delta's is ignored. To change an
      existing capability's Purpose - including a leftover `TBD` placeholder -
      edit `<planningHome.root>/openspec/specs/<capability-path>/spec.md`
      directly. `planningHome.root` comes from the `openspec instructions ...
      --json` response. Always use it rather than a repo-relative path: it
      resolves to the store whenever the change lives in one - whether that
      came from `--store`, a project `store:` pointer, or a global default
      store - and to the current repository otherwise. Do not try to work out
      which case applies; the field already has.

      MODIFIED requirements workflow:
      1. Locate the existing requirement in `<planningHome.root>/openspec/specs/<capability-path>/spec.md` (the same store-aware root as above)
      2. Copy the ENTIRE requirement block (from `### Requirement:` through all scenarios)
      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior
      4. Ensure header text matches exactly (whitespace-insensitive)

      Common pitfall: Using MODIFIED with partial content loses detail at archive time.
      If adding new concerns without changing existing behavior, use ADDED instead.

      Example (a new capability, so its first section is `## Purpose`):
      ```
      # Spec Delta

      ## Purpose

      Lets users take their data out of the product in a portable format.

      ## ADDED Requirements

      ### Requirement: User can export data
      The system SHALL allow users to export their data in CSV format.

      #### Scenario: Successful export
      - **WHEN** user clicks "Export" button
      - **THEN** system downloads a CSV file with all user data

      ## REMOVED Requirements

      ### Requirement: Legacy export
      **Reason**: Replaced by new export system
      **Migration**: Use new export endpoint at /api/v2/export
      ```

      Specs should be testable - each scenario is a potential test case.
    requires: []

  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: |
      Create the design document that explains HOW to implement the change.

      When to include design.md (create only if any apply):
      - Cross-cutting change (multiple services/modules) or new architectural pattern
      - New external dependency or significant data model changes
      - Security, performance, or migration complexity
      - Ambiguity that benefits from technical decisions before coding

      Sections:
      - **Context**: The current state, the problem and the constraints that shape the approach. Link the ticket or request for motivation instead of restating it.
      - **Goals / Non-Goals**: What this design achieves and explicitly excludes. Don't restate the spec's scope - add only design-level boundaries.
      - **Flow**: A mermaid diagram when a flow, schema or state changes. Keep it IDE-safe: only flowchart, sequenceDiagram, stateDiagram-v2 or erDiagram; quote labels with punctuation; no `;`, `#` or `<...>` in sequence messages; never `end` as an id. Validate with `mmdc` when installed.
      - **Decisions**: Key technical choices with rationale (why X over Y?). Include alternatives considered for each decision.
      - **Shared contracts**: Every type, interface, migration and API shape the change adds or changes, and the packages each part touches.
      - **Test scenarios**: A table of `TC-...` ids with scenario, given, when, then, the `Requirement` name each row proves, and `Proof` - one of `unit | integration | api | ui | device | manual`. `unit` and `integration` route to the verify node; `api`, `ui`, `device` and `manual` route to QA (`ui` is web, `device` is mobile), so the column decides which gate proves each scenario. Spec deltas cite requirement names, never `TC-...` ids: specs and design are both roots, so a delta cannot rely on a row that may not exist yet.
      - **Verification**: A table of the commands the verify stage runs, per project: the migrate, build, typecheck, lint and suite commands the project already defines. Example rows: a Go API with `make migrate` (or the project's migration validation), `go build`, `go vet`, `golangci-lint` and `go test`; a web client with no migration, `tsc --noEmit`, eslint, vitest or jest, and the build; a mobile client with no migration, `flutter analyze` or `dart analyze`, test, and the build. Write `none` where a stack has no command. State which behavior is proven by the suite and which only by QA, so a scenario is not left to both or to neither; the verify node runs these commands and never invents its own.
      - **Observability**: The log events, their levels and fields, the trace spans, the metric names and labels, and what must never be logged. Review checks this section against the code; `none` is a legal answer but needs the reason.
      - **Risks / Trade-offs**: Known limitations, things that could go wrong. Format: [Risk] → Mitigation
      - **Migration Plan**: Steps to deploy, rollback strategy (if applicable)
      - **Docs to update**: Every doc the change must update, at the paths the project uses. Derive the list from the project's own conventions; never assume a docs layout. Write `none` when no doc changes.
      - **Open Questions**: Unknowns that can safely be answered later without
        changing the specs, the approach, or the task breakdown. Omit if none.

      Rules:
      - Explain code flow with the `call-graph` skill, not prose.
      - Define test scenarios with the `test-scenario` skill; their ids become the `TC-...` values.
      - Write HTTP endpoint tests with the `hurl-write` skill when the project uses hurl. Change-only checks go in the project's scratch test location; lasting asserts extend the matching regression file.
      - Name every new or renamed foreign key column, and every column, JSON key or payload field holding another row's id, by the project's foreign-key naming rule, and list them under Shared contracts.
      - Test scenarios and HTTP tests run in the project's local environment only; never plan staging or production testing.

      Open questions are for genuinely deferrable unknowns, not decisions you
      skipped. If a question would change the specs, the chosen approach, or
      the task breakdown, resolve it now - ask the user instead of guessing.

      Focus on architecture and approach, not line-by-line implementation.
      The specs cover what; design covers how. Reference the specs for
      requirements and the ticket for motivation - if a section would only
      restate them, point to them instead.

      Good design docs explain the "why" behind technical decisions.
    requires: []

  - id: tasks
    generates: tasks.md
    description: Explicit work graph - nodes, edges, ownership, resources and gates
    template: tasks.md
    instruction: |
      Write the change's work graph as tasks.md. The schema README beside this file owns the
      full grammar, states and the ready-set rules; this list is what to get right while writing. Do not add `## Wave` sections or any other ordering layer.

      Before writing, check design.md for Open Questions. If any would change what
      gets built, resolve them with the user first.

      First line of the file, exact:
      `<!-- openspec-graph: 2 -->`

      A file marked `: 1` is v1 and read-only: never migrate or rewrite it.

      One node per heading: `### <id>. <title> — <agent>`. Node ids are unique positive
      integers; gaps are allowed, so inserting a node never renumbers the rest. The owner
      is the agent id that will execute the node.

      Metadata lines follow the heading, before the first task, each exactly once:
      - `Depends on: none` or `Depends on: 1, 2` - node ids only. Never a wave, a group, a
        range or prose.
      - `Owns: path, path` or `Owns: none` - every file the node writes. Two nodes with
        overlapping paths (or the same Go package) never run together.
      - `Resource: db:test, build` - optional non-file conflicts. The fullstack ones are
        `db:test`, `port:<n>`, `emulator`, `metro` and `build` (generated clients, lockfiles).
        Tag only what the node actually holds; nodes sharing a tag never run together.
      - `Gate: build | verify | qa | review | human | none` - default `build`. `unit` is
        v1-only and reads as `build`.
      - `Evidence: evidence/<file>.md` - required for `verify`, `qa`, `review` and `human`. The
        path is relative to the change, and the file is scratch: written while the gate
        verifies, read by the planner, never committed and never archived. It is exactly
        `evidence/<name>.md` - no `..`, no leading `/`, no other directory - and `.gitignore`
        carries `openspec/changes/**/evidence/`.

      Gates and stages:
      - `build` (stage 1): the project's builder writes the planned code and its tests and fixtures,
        then compiles, parses or runs the narrowest structural check on the files it touched - a
        validator, or a `grep` for required content where there is no compiler - test files
        included, never a behavior test. Nothing else - no lint, no full typecheck, no suite, no
        server, no browser. `none` also sits in stage 1 and checks nothing: a spike or a manual step
        only.
      - `verify` (stage 2): the project's build owner, resumed, runs every command in design's
        Verification table once for the project, reports each exit code, and fixes mechanical
        failures inline. It owns no files and writes only inside the build nodes' paths it
        depends on.
      - `qa` (stage 2): the behavioral QA agent drives the behavioral scenarios
        (`Proof: api | ui | device | manual`) on the running app and never fixes. `qa` and `review` both
        depend only on `verify` and run concurrently.
      - `review` (stage 3): the static review agent reads the diff. `human` (stage 3) is a user
        decision.

      Stage order: build nodes first; then one verify node per project, after that project's
      builds; then review and QA. Every plan has a review gate, and any behavior change gets a
      QA gate. Fast path: one project and at most three nodes may put `Gate: verify` on a builder
      node instead of adding a verify node; review stays separate. A fused node keeps its own
      `Owns:` list and writes only those files - the `Owns: none` gate rule does not apply to it.
      Any code change reopens every gate downstream of it.

      Tasks are `- [ ] <id>.<n> <text> Check: <command> Covers: <TC-...>`. The apply phase
      parses the checkbox: `[x]` is done; every other marker is unfinished. The id prefix
      must equal the node id: node 2 owns 2.1, 2.2.
      - `Check:` states how to prove the task, with the command and the outcome that must
        hold. Per gate: build = the project's compile, parse or narrowest structural check of the
        touched files - a validator, or a `grep` for required content where there is no compiler -
        test files included, exits 0, never a behavior test; verify = every command in design's
        Verification table, each exit code reported; qa = the scenario pass/fail shape; review =
        findings by file and severity, and no project command run.
      - `Covers:` names ids from design.md's Test scenarios table or the main specs' scenarios.
        A build node names the TCs it implements; `all` is legal on verify, qa and review.
      - Keep node and task ids stable; other artifacts reference them.

      Rules:
      - One node per subagent invocation. Split a node when its tasks span unrelated
        check commands, more than one agent, or a shared file with a sibling.
      - Put shared contracts and hotspot files in the first nodes; put verify, review and QA
        gates after the builds they prove. Every node must be completable without another
        node's unmerged work.
      - Width is the default: every node that can start without another's output shares that
        layer. Extract a shared contract into an early node instead of serializing its consumers.
        Add a `Depends on:` edge only when the dependent needs a named output - a path, an
        interface or a TC - and name it in the task text. A serial edge must name its output; a
        fully serial plan needs a reason per edge.
      - Tag `Resource:` only for a genuinely shared resource - generated output, lockfile, DB,
        port. Over-tagging serializes the plan.
      - Two `build` nodes in one project may run together when their `Owns:` paths are disjoint and
        they share no `Resource:` tag. From verify onward, one node per project at a time. `qa` is
        per project, so it runs concurrently across projects; a flow spanning projects gets its own
        node depending on both projects' verify nodes.
      - A fullstack plan starts with one API/schema contract node. Backend, web and mobile depend on
        that contract, not on the backend implementation, so their builds run in parallel; review is
        one node over the combined diff, reading the contract seam first.
      - A node writes and compiles the tests for its behavior; the verify node runs them.
        A node must pass its checks with only its ancestors in the tree.
      - If two nodes write the same file, merge them or extract the file into an earlier
        contract node.
      - Include a review gate (`Covers: all`) and, when behavior changes, a QA gate with its
        evidence path. Review and QA report only; they do not fix.
      - Each build node is resumed at most once, to fix all findings its gates batch into one
        message; surviving findings go to the user.
      - Every path listed under Docs to update in design.md is owned by a node, and the doc
        update lands in the node that changes the behavior it documents.

      Layers and the ready set are computed from `Depends on:`, `Owns:` and `Resource:`;
      never write them. The standard view is the `task-graph` skill's board.

      Example nodes:
      ```
      ### 2. Export endpoint — golang-eng
      Depends on: 1
      Owns: internal/exports/service.go, internal/exports/service_test.go
      Gate: build

      - [ ] 2.1 Stream a CSV for a date range; Check: `go build ./internal/exports/` and `go test -run '^$' ./internal/exports/...` exit 0, so the package and its tests compile. Covers: TC-102, TC-103

      ### 3. Verify — golang-eng
      Depends on: 1, 2
      Owns: none
      Gate: verify
      Evidence: evidence/verify-go.md

      - [ ] 3.1 Run every command in design's Verification table. Check: each exit code reported. Covers: all
      ```
    requires:
      - specs
      - design

  - id: graph
    generates: graph.md
    description: Plan snapshot of the work graph as a terminal-friendly ASCII layer board
    template: graph.md
    instruction: |
      Write the work graph into graph.md, once, immediately after tasks.md is written.

      Draw it in the board format the schema README defines: a header with the source
      hash, the node and layer counts and the stage counts (`b` build · `v` verify · `r`
      review, zero stages omitted, `qa` counted in verify and `human` in review), one
      plain-text line per node (layer, state, id, title, owner, tasks done/total,
      dependencies and gate tag), a footer with the ready set (first 4 ids, then `+<n>`),
      conflict-deferred and blocked nodes and the critical path, then the TC coverage table.
      Gate tags are `{verify}`, `{qa}`, `{review}` and `{human}`; a `build` node carries none. Plain text, so it reads in any
      terminal; the `task-graph` skill draws the same board on demand.

      graph.md is a plan snapshot, not a live view. Do not redraw it when a task is ticked
      during apply and do not edit it to change the plan: plan changes go in tasks.md. The
      `Source:` hash is provenance and nothing compares it.
    requires:
      - tasks

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Execute tasks.md as a graph, not a list.

    1. Ready = every node whose dependencies are `done` or `skipped`, in `(layer, id)` order.
       Select by conflict only: skip a node sharing an `Owns:` path or a `Resource:` tag with one
       already selected. There is no batch-size cap. Two `build` nodes in one project may run
       together when their paths are disjoint and they share no `Resource:` tag; from verify
       onward, one node per project at a time. Hand each node to the agent named in its heading;
       never code inline.
    2. Build: write the code and its tests; compile, parse or run the narrowest structural check
       on the files it touched (a validator, or a content grep where there is no compiler), test
       files included, never a behavior test. Nothing else - no lint, no full typecheck, no suite,
       no server, no browser.
    3. Verify: run design's Verification commands once for the project and fix mechanical
       failures inline, in the same session. QA nodes then drive the behavioral test scenarios
       on the running app and never fix.
    4. Review: static read only - `git diff --stat`, then `git diff`. Never run a project
       command; a claim that needs execution is a `🧪 verify` finding routed to that project's
       builder in the batched fix round, or run by the caller when no round opens.
    5. Collect: hold every gate report until the gates of that layer finish, then dispatch each
       project's findings to that project's builder once, verbatim, with the fix round stated.
       One wake-up per project, not one per gate.
    6. One fix round: the builder fixes, runs the scoped verify and reports. Then re-review only
       the fix diff, and re-run QA only the failed scenario ids. Findings surviving this round go
       to the user.
    7. A node is done only when every `Check:` passes. Never tick a box to unblock downstream
       work; a failure writes `(failed: reason)`. A gate's durable record is the summary on the
       task line, never a path to its evidence.
    8. Invalidation: a changed file reopens every gate node downstream of it.
    9. Time every node execution. Before handing a node to its agent, run and print
       `date '+%Y-%m-%d %H:%M:%S %Z (%z)'` as `node <id> start: <output>`; when its tasks are
       marked, run it again as `node <id> end: <output>`. Journal both in the `## Execution log`
       table with the node id, its agent and the minutes spent - end minus start, whole minutes,
       rounded to the nearest. A fix-round resume is another execution: its own row, same node id.
       When every node is done, print `total: <minutes>` and journal a `Total` row: the sum of
       every dispatch's minutes, with the earliest start and the latest end in its timestamp cells.

    Use the `impl-journal` skill to record every decision the plan did not make, as it is made.
    The applying orchestrator is the only writer, and a node's agent reports a decision in its
    result rather than editing the file. The journal is `journal.md` in the change directory,
    committed with the change; it is not an artifact, so `openspec status`, `validate` and the
    archive task gate ignore it, and `apply.tracks` stays `tasks.md`. A gate verdict is not a
    journal entry: its durable record is the marker or summary on the task line. The execution log
    from step 9 lives there too, one row per node dispatch, in the table the skill defines.

    Pause on blockers or material ambiguity. Do not invent a task to satisfy a
    dependency, and do not start a blocked node because it looks independent. Project
    apply-time doctrine belongs in `operations.apply.guidance` in openspec/config.yaml,
    not here.

